graphSchema:
  pathName: /examples/mixed-import
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - import: imports/snb-types/lex-2026.0.3.2-snb-message-hierarchy.yaml
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
    - nodeType:
        typeLabel: Company
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
    edgeTypes:
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabel: Company
          via: WORKS_FOR
        implies:
          propertyTypes:
          - name: startDate
            valueType: DATE
