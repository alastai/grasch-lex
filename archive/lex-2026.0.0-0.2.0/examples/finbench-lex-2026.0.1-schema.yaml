# LDBC FinBench (Financial Benchmark) Schema
# LEX:2026.0.1 Graph Schema Format
# Based on LDBC FinBench data.tex specification
# Version: LEX:2026.0.1

identifier:
  name: "ldbc-finbench"
  directory: ["benchmarks", "ldbc"]
  root: "https://ldbcouncil.org/schemas/"

# valueTypeSystemName is optional in 0.1, defaults to CANONICAL
# valueTypeSystemName: "CANONICAL"

graphType:
  graphPreferredName: "PROPERTY GRAPH"
  nodePreferredName: "NODE"
  edgePreferredName: "RELATIONSHIP"
  
  nodeTypeMinimumLabels: 1
  nodeTypeMaximumLabels: 1
  nodeTypeMinimumPropertyTypes: 1
  nodeTypeMaximumPropertyTypes: 15
  
  edgeTypeMinimumLabels: 1
  edgeTypeMaximumLabels: 1
  edgeTypeMinimumPropertyTypes: 0
  edgeTypeMaximumPropertyTypes: 10
  
  nodeTypes:
    # Person - A person of the real world
    - index: 0
      labels: ["Person"]
      propertyTypes:
        - name: "id"
          valueType:
            name: "INTEGER"
            parameters:
              NULLABLE: false
        - name: "name"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "isBlocked"
          valueType:
            name: "BOOLEAN"
            parameters:
              NULLABLE: false
        - name: "createTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "gender"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "birthday"
          valueType:
            name: "DATE"
            parameters:
              NULLABLE: false
        - name: "country"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "city"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false

    # Company - A company of the real world
    - index: 1
      labels: ["Company"]
      propertyTypes:
        - name: "id"
          valueType:
            name: "INTEGER"
            parameters:
              NULLABLE: false
        - name: "name"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "isBlocked"
          valueType:
            name: "BOOLEAN"
            parameters:
              NULLABLE: false
        - name: "createTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "country"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "city"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "business"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "description"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "url"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false

    # Account - An account in financial systems
    - index: 2
      labels: ["Account"]
      propertyTypes:
        - name: "id"
          valueType:
            name: "INTEGER"
            parameters:
              NULLABLE: false
        - name: "createTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "isBlocked"
          valueType:
            name: "BOOLEAN"
            parameters:
              NULLABLE: false
        - name: "type"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "nickname"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "phoneNumber"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "email"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "freqLoginType"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "lastLoginTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "accountLevel"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false

    # Loan - A loan for persons and companies
    - index: 3
      labels: ["Loan"]
      propertyTypes:
        - name: "id"
          valueType:
            name: "INTEGER"
            parameters:
              NULLABLE: false
        - name: "loanAmount"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
        - name: "balance"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
        - name: "usage"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "interestRate"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false

    # Medium - Things users use to sign in accounts
    - index: 4
      labels: ["Medium"]
      propertyTypes:
        - name: "id"
          valueType:
            name: "INTEGER"
            parameters:
              NULLABLE: false
        - name: "type"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "createTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "isBlocked"
          valueType:
            name: "BOOLEAN"
            parameters:
              NULLABLE: false
        - name: "lastLoginTime"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "riskLevel"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false

  edgeTypes:
    # signIn - An account signed in with a medium
    # NOTE: No index field in LEX:2026.0.1 - edge types are not indexed
    - labels: ["signIn"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "location"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 4  # Medium
      secondEndpointNodeType: 2  # Account

    # own - An account owned by a person or company
    - labels: ["own"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 0  # Person (can also be Company)
      secondEndpointNodeType: 2  # Account

    # transfer - Fund transferred between accounts
    - labels: ["transfer"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "amount"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
        - name: "ordernumber"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "comment"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "payType"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
        - name: "goodsType"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 2  # Account
      secondEndpointNodeType: 2  # Account

    # withdraw - Fund transferred from account to card account
    - labels: ["withdraw"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "amount"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 2  # Account
      secondEndpointNodeType: 2  # Account

    # apply - A person or company applies for a loan
    - labels: ["apply"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "organization"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 0  # Person (can also be Company)
      secondEndpointNodeType: 3  # Loan

    # deposit - Loan fund deposited to an account
    - labels: ["deposit"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "amount"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 3  # Loan
      secondEndpointNodeType: 2  # Account

    # repay - Loan repaid from an account
    - labels: ["repay"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "amount"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 2  # Account
      secondEndpointNodeType: 3  # Loan

    # invest - A person or company invests in a company
    - labels: ["invest"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "ratio"
          valueType:
            name: "FLOAT"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 0  # Person (can also be Company)
      secondEndpointNodeType: 1  # Company

    # guarantee - A person or company guarantees another
    - labels: ["guarantee"]
      propertyTypes:
        - name: "timestamp"
          valueType:
            name: "LOCAL DATETIME"
            parameters:
              NULLABLE: false
        - name: "relationship"
          valueType:
            name: "STRING"
            parameters:
              NULLABLE: false
      direction: "DIRECTED"
      firstEndpointNodeType: 0  # Person (can also be Company)
      secondEndpointNodeType: 0  # Person (can also be Company)

  nodeTypeKeyLabelSetDictionary:
    "Person": 0
    "Company": 1
    "Account": 2
    "Loan": 3
    "Medium": 4

  edgeTypeKeyLabelSetDictionary:
    "signIn": ["signIn"]
    "own": ["own"]
    "transfer": ["transfer"]
    "withdraw": ["withdraw"]
    "apply": ["apply"]
    "deposit": ["deposit"]
    "repay": ["repay"]
    "invest": ["invest"]
    "guarantee": ["guarantee"]

# Constraints are optional in LEX:2026.0.1
constraints:
  personIdUnique:
    name: "personIdUnique"
    rule:
      subject: "UNIQUE"
      constraintPattern: "(:Person)"
      uniqueKeyComponentPropertyNames: ["id"]
  
  companyIdUnique:
    name: "companyIdUnique"
    rule:
      subject: "UNIQUE"
      constraintPattern: "(:Company)"
      uniqueKeyComponentPropertyNames: ["id"]
  
  accountIdUnique:
    name: "accountIdUnique"
    rule:
      subject: "UNIQUE"
      constraintPattern: "(:Account)"
      uniqueKeyComponentPropertyNames: ["id"]