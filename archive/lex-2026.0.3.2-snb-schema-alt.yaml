# SNB (Social Network Benchmark) Schema Configuration
# Conformant with GQL Descriptors JSON Schema (Base Standard - No Inheritance)
# Based on LDBC SNB data.tex specification

graphSchema:
  pathName: /examples/lex-2026.0.3.2-snb-schema-alt
  
  graphType:
    declaredName: "GRAPH DATA"
    preferredName: "PROPERTY GRAPH"
    
    nodeTypeDescriptors:
    # Person - The avatar a real world person creates when joining the network
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Person"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "firstName"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "lastName"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "gender"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 10
            includesNull: false
        - name: "birthday"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATE"
            capturesDate: true
            capturesTimeOfDay: false
            includesTimeZone: false
            includesNull: false
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
        - name: "locationIP"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 50
            includesNull: false
        - name: "browserUsed"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false

    # Forum - A meeting point where people post messages
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Forum"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "title"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false

    # Post - A message posted in a forum (no inheritance from Message)
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Post"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "imageFile"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: true
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
        - name: "locationIP"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 50
            includesNull: false
        - name: "browserUsed"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "language"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 10
            includesNull: true
        - name: "content"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 2000
            includesNull: true

    # Comment - A comment to an existing message (no inheritance from Message)
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Comment"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
        - name: "locationIP"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 50
            includesNull: false
        - name: "browserUsed"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "content"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 2000
            includesNull: false

    # Tag - A topic or concept
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Tag"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "name"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "url"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false

    # TagClass - A class used to build a hierarchy of tags
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["TagClass"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "name"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "url"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false

    # Place - A place in the world
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Place"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "name"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "url"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "type"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 50
            includesNull: false

    # Organisation - An institution
    - declaredName: "NODE DATA"
      preferredName: "NODE"
      labelSet: ["Organisation"]
      propertyTypeSet:
        - name: "id"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "BIGINT"
            radix: 10
            precision: 19
            scale: 0
            includesNull: false
        - name: "type"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 50
            includesNull: false
        - name: "name"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
        - name: "url"
          valueType:
            declaredName: "STRING DATA"
            preferredName: "STRING"
            minLength: 0
            maxLength: 255
            includesNull: false
    
    edgeTypeDescriptors:
      # knows - Connects two Persons that know each other (undirected)
      - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["knows"]
      propertyTypeSet:
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
      isDirected: false
      endpointNodeTypes: ["Person", "Person"]

    # hasCreator - Links posts/comments to their creators
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasCreator"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Post"
      destinationNodeType: "Person"

    # containerOf - Links forums to posts
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["containerOf"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Forum"
      destinationNodeType: "Post"

    # replyOf - Links comments to posts they reply to
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["replyOf"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Comment"
      destinationNodeType: "Post"

    # hasTag - Links posts/forums to tags
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasTag"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Post"
      destinationNodeType: "Tag"

    # hasInterest - Links persons to tags they're interested in
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasInterest"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Person"
      destinationNodeType: "Tag"

    # hasMember - Links forums to their members
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasMember"]
      propertyTypeSet:
        - name: "joinDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
      isDirected: true
      sourceNodeType: "Forum"
      destinationNodeType: "Person"

    # hasModerator - Links forums to their moderators
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasModerator"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Forum"
      destinationNodeType: "Person"

    # likes - Links persons to posts they like
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["likes"]
      propertyTypeSet:
        - name: "creationDate"
          valueType:
            declaredName: "TEMPORAL INSTANT DATA"
            preferredName: "DATETIME"
            capturesDate: true
            capturesTimeOfDay: true
            includesTimeZone: false
            includesNull: false
      isDirected: true
      sourceNodeType: "Person"
      destinationNodeType: "Post"

    # isLocatedIn - Links entities to places
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["isLocatedIn"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Person"
      destinationNodeType: "Place"

    # studyAt - Links persons to universities
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["studyAt"]
      propertyTypeSet:
        - name: "classYear"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "INTEGER"
            radix: 10
            precision: 4
            scale: 0
            includesNull: false
      isDirected: true
      sourceNodeType: "Person"
      destinationNodeType: "Organisation"

    # workAt - Links persons to companies
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["workAt"]
      propertyTypeSet:
        - name: "workFrom"
          valueType:
            declaredName: "EXACT NUMERIC DATA"
            preferredName: "INTEGER"
            radix: 10
            precision: 4
            scale: 0
            includesNull: false
      isDirected: true
      sourceNodeType: "Person"
      destinationNodeType: "Organisation"

    # hasType - Links tags to tag classes
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["hasType"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Tag"
      destinationNodeType: "TagClass"

    # isSubclassOf - Links tag classes in hierarchy
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["isSubclassOf"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "TagClass"
      destinationNodeType: "TagClass"

    # isPartOf - Links places in hierarchy
    - declaredName: "EDGE DATA"
      preferredName: "EDGE"
      labelSet: ["isPartOf"]
      propertyTypeSet: []
      isDirected: true
      sourceNodeType: "Place"
      destinationNodeType: "Place"
    
    nodeTypeKeyLabelSetDictionary:
      "Person": ["Person"]
    "Forum": ["Forum"]
    "Post": ["Post"]
    "Comment": ["Comment"]
    "Tag": ["Tag"]
    "TagClass": ["TagClass"]
    "Place": ["Place"]
    "Organisation": ["Organisation"]
    
    edgeTypeKeyLabelSetDictionary:
      "knows": ["knows"]
    "hasCreator": ["hasCreator"]
    "containerOf": ["containerOf"]
    "replyOf": ["replyOf"]
    "hasTag": ["hasTag"]
    "hasInterest": ["hasInterest"]
    "hasMember": ["hasMember"]
    "hasModerator": ["hasModerator"]
    "likes": ["likes"]
    "isLocatedIn": ["isLocatedIn"]
    "studyAt": ["studyAt"]
    "workAt": ["workAt"]
    "hasType": ["hasType"]
    "isSubclassOf": ["isSubclassOf"]
    "isPartOf": ["isPartOf"]
    
    constraintSetDictionary: {}