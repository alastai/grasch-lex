# Complete Import Patterns Example
# Demonstrates all supported import patterns

pathName: "/examples/all-import-patterns"

valueTypeSystemName: "CANONICAL"

graphType:
  # Pattern 1: Import defaults block
  defaults:
    import: "lex-2026.0.3.1-graph-type-defaults.yaml"
  
  # Pattern 2: Import entire nodeTypes array
  nodeTypes:
    import: "snb_types/all_node_types.yaml"
  
  # Pattern 3: Import entire edgeTypes array
  edgeTypes:
    import: "snb_types/all_edge_types.yaml"
