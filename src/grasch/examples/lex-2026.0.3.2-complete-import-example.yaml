# Complete Import Example - Shows importing graphSchema contents within a graph

graph:
  pathName: /examples/my-graph-instance
  
  # Import graphSchema
  graphSchema:
    import: lex-2026.0.3.2-snb-schema.yaml
  
  # Preserved for future work
  subtypesOfSchemaType:
    graphSchema:
      pathName: /benchmarks/ldbc/snb
      import: lex-2026.0.3.2-snb-schema.yaml
  
  # Storage schema for this graph instance
  graphStorageSchema:
    storageType: kuzu
    databasePath: ./data/my-graph-instance.kuzu
    bufferPoolSize: 1GB
    maxNumThreads: 4
