# Complete Import Example - Shows importing graphSchema contents within a graph

# This is a GRAPH (instance), not a standalone schema
graph:
  identifier:
    locallyQualifiedObjectName: "/examples/my-graph-instance"
  
  # Pattern: Reference the schema identifier explicitly, import the schema contents
  graphSchema:
    identifier:
      locallyQualifiedObjectName: "/benchmarks/ldbc/snb"
    import: "snb-lex-2026.0.3.1-schema.yaml"
  
  # Storage schema for this graph instance
  storageSchema:
    storageType: "kuzu"
    databasePath: "./data/my-graph-instance.kuzu"
    # Optional Kuzu-specific configuration
    bufferPoolSize: "1GB"
    maxNumThreads: 4
