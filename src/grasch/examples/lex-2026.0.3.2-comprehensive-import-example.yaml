graphSchema:
  pathName: /examples/comprehensive-imports
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
    - nodeType:
        typeLabel: Tag
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
    edgeTypes:
    - edgeType:
        undirected:
          between: Person
          and: Person
          via: KNOWS
        implies:
          propertyTypes: []
    subtypesOf:
      abstract:
        nodeTypes:
        - nodeType:
            typeLabel: Message
            implies:
              propertyTypes:
              - name: id
                valueType: INTEGER
  constraints:
    personIdUnique:
      name: personIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Person
        uniqueKeyComponentPropertyNames:
        - id
