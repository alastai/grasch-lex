# SNB Message Type Hierarchy
# Message is an abstract supertype for Post and Comment
# All instances have the Message label plus their specific subtype label

allowSubtypesOf:
  abstractSupertype:
    nodeTypes:
    # Abstract Message supertype - never instantiated directly
    - nodeType:
        typeLabel: Message
        implies:
          propertyTypes:
            - name: id
              valueType: INTEGER
              notNull: true
            - name: creationDate
              valueType: ZONED DATETIME
              notNull: true
            - name: locationIP
              valueType: STRING
              notNull: true
            - name: browserUsed
              valueType: STRING
              notNull: true
            - name: content
              valueType: STRING
            - name: length
              valueType: INTEGER
              notNull: true

    # Post subtype - instances have labels [Message, Post]
    - nodeType:
        typeLabel: Post
        implies:
          supertypes:
            - Message
          propertyTypes:
            - name: imageFile
              valueType: STRING
            - name: language
              valueType: STRING

    # Comment subtype - instances have labels [Message, Comment]
    - nodeType:
        typeLabel: Comment
        implies:
          supertypes:
            - Message
          propertyTypes: []
