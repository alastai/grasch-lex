# Phase B Test: EdgeType with TI wrappers (no endpoint TIs yet)
# Tests simplified single-level TI system: 0-level (bare), 1-level synonyms, and 1-level primary forms

graphSchema:
  pathName: /test/phase-b
  graphType:
    propertyGraphDataModel:
      valueTypeSystemName: CANONICAL
    
    nodeTypes:
      - nodeType:
          typeLabel: Person
          implies:
            labels: [Person]
            propertyTypes:
              - name: name
                valueType: STRING
      - nodeType:
          typeLabel: Company
          implies:
            labels: [Company]
            propertyTypes:
              - name: name
                valueType: STRING
    
    edgeTypes:
      # 0-level: Bare edgeType (implicit exactlyOf: concrete:)
      - edgeType:
          directed:
            from: Person
            to: Person
            via:
              typeLabel: KNOWS
              implies:
                propertyTypes:
                  - name: since
                    valueType: DATE
      
      # 1-level: Shorthand - abstract
      - abstract:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: MANAGES
              to: Person
            implies:
              propertyTypes:
                - name: startDate
                  valueType: DATE
      
      # 1-level: Shorthand - concrete
      - concrete:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: WORKS_FOR
              to: Company
            implies:
              propertyTypes:
                - name: position
                  valueType: STRING
      
      # 1-level: Shorthand - exactlyOf (final not yet implemented)
      - exactlyOf:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: OWNS
              to: Company
            implies:
              propertyTypes:
                - name: shares
                  valueType: FLOAT
      
      # 1-level: Shorthand - properSubtypesOf
      - properSubtypesOf:
          edgeType:
            undirected:
              between: Person
              via:
                typeLabel: RELATED_TO
              and: Person
            implies:
              propertyTypes:
                - name: relationship
                  valueType: STRING
      
      # 1-level: Primary form - exactlyOfConcrete
      - exactlyOfConcrete:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: LIVES_IN
              to: Person
            implies:
              propertyTypes:
                - name: since
                  valueType: DATE
      
      # 1-level: Primary form - subtypeOfAbstract
      - subtypeOfAbstract:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: INTERACTS_WITH
              to: Person
            implies:
              propertyTypes:
                - name: timestamp
                  valueType: ZONED DATETIME
      
      # 1-level: Primary form - subtypeOfConcrete
      - subtypeOfConcrete:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: SUPERVISES
              to: Person
            implies:
              propertyTypes:
                - name: level
                  valueType: INTEGER
      
      # 1-level: Primary form - subtypeOfAbstract
      - subtypeOfAbstract:
          edgeType:
            undirected:
              between: Person
              via:
                typeLabel: COLLABORATES_WITH
              and: Person
            implies:
              propertyTypes:
                - name: project
                  valueType: STRING
      
      # 1-level: Synonym - properSubtypeOf (maps to subtypeOfAbstract)
      - properSubtypeOf:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: REPORTS_TO
              to: Person
            implies:
              propertyTypes:
                - name: department
                  valueType: STRING
      
      # 1-level: Synonym - subtypeOf (maps to subtypeOfConcrete)
      - subtypeOf:
          edgeType:
            directed:
              from: Person
              via:
                typeLabel: INFLUENCES
              to: Person
            implies:
              propertyTypes:
                - name: strength
                  valueType: FLOAT
