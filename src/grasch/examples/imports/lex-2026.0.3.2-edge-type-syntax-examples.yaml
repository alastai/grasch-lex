# LEX-2026.0.3.2 Edge Type Syntax Examples
# Comprehensive demonstration of all edge type syntax variations
# Note: This file defines only edgeTypes and can be imported into graph types
# Node types are defined in lex-2026.0.3.2-node-type-syntax-examples.yaml

edgeTypes:
  # ========================================
  # DIRECTED EDGES - from:/to: syntax
  # ========================================
  
  # Pattern 1: Basic directed edge with type references
  - edgeType:
      directed:
        from: Person
        to: Person
        via: KNOWS
      implies:
        propertyTypes:
        - name: since
          valueType: DATE
  
  # Pattern 2: Directed edge with arc synonym
  - edgeType:
      directed:
        from: Person
        to: Company
        arc: EMPLOYED_BY
      implies:
        propertyTypes:
        - name: startDate
          valueType: DATE
  
  # Pattern 3: Directed edge without properties
  - edgeType:
      directed:
        from: Person
        to: Company
        via: MANAGES
  
  # Pattern 4: Self-loop using SAME
  - edgeType:
      directed:
        from: Person
        to: SAME
        via: REPORTS_TO
  
  # Pattern 5: Self-loop using SELF
  - edgeType:
      directed:
        from: Employee
        to: SELF
        via: MENTORS
      implies:
        propertyTypes:
        - name: startDate
          valueType: DATE
  
  # Pattern 6: Using anonymous node type with index
  - edgeType:
      directed:
        from: Person
        to: 0
        via: LINKS_TO
  
  # Pattern 7: Using typeIdentifier (array of labels)
  - edgeType:
      directed:
        from: ["Person", "Employee"]
        to: Company
        via: CREATED_BY
      implies:
        propertyTypes:
        - name: creationDate
          valueType: ZONED DATETIME
  
  # Pattern 8: Using typeLabels for multi-label endpoint reference
  - edgeType:
      directed:
        from: Person
        to:
          typeLabels:
          - Product
          - Sellable
        via: PURCHASES
      implies:
        propertyTypes:
        - name: purchaseDate
          valueType: DATE
        - name: quantity
          valueType: INTEGER
  
  # ========================================
  # DIRECTED EDGES - tail:/head: synonyms
  # ========================================
  
  - edgeType:
      directed:
        tail: Person
        head: Person
        via: FOLLOWS
      implies:
        propertyTypes:
        - name: since
          valueType: DATE
  
  # ========================================
  # DIRECTED EDGES - src:/dst: synonyms
  # ========================================
  
  - edgeType:
      directed:
        src: Person
        dst: Person
        via: SENDS_TO
      implies:
        propertyTypes:
        - name: timestamp
          valueType: ZONED DATETIME
  
  # Pattern with dest: instead of dst:
  - edgeType:
      directed:
        src: Person
        dest: Company
        via: TRANSFERS_TO
      implies:
        propertyTypes:
        - name: amount
          valueType: FLOAT
  
  # ========================================
  # DIRECTED EDGES - Inline node type definitions
  # ========================================
  
  # Inline definition - demonstrates inline syntax (keep for reference)
  - edgeType:
      directed:
        from:
          nodeType:
            typeLabel: Person
            implies:
              propertyTypes:
              - name: id
                valueType: INTEGER
        to: Company
        via: CONNECTS_TO
  
  # Inline definition of NEW type not in node type spec
  - edgeType:
      directed:
        from: Person
        to:
          nodeType:
            typeLabel: Property
            implies:
              propertyTypes:
              - name: id
                valueType: INTEGER
              - name: address
                valueType: STRING
              - name: value
                valueType: FLOAT
        via: OWNS
      implies:
        propertyTypes:
        - name: purchaseDate
          valueType: DATE
  
  # Inline anonymous node type (not in node type spec)
  - edgeType:
      undirected:
        between: Company
        and:
          nodeType:
            index: 99
            implies:
              propertyTypes:
              - name: linkId
                valueType: STRING
        via: LINKED_TO
  
  # ========================================
  # UNDIRECTED EDGES - between:/and: syntax
  # ========================================
  
  # Pattern 1: Basic undirected edge
  - edgeType:
      undirected:
        between: Person
        via: COLLABORATES_WITH
        and: Person
      implies:
        propertyTypes:
        - name: projectName
          valueType: STRING
  
  # Pattern 2: via before between/and
  - edgeType:
      undirected:
        via: PARTNERS_WITH
        between: Company
        and: Company
      implies:
        propertyTypes:
        - name: since
          valueType: DATE
  
  # Pattern 2b: arc synonym for via
  - edgeType:
      undirected:
        arc: ALLIED_WITH
        between: Company
        and: Company
      implies:
        propertyTypes:
        - name: since
          valueType: DATE
  
  # Pattern 3: via after between/and (no properties)
  - edgeType:
      undirected:
        between: Person
        and: Person
        via: SHARES_WITH
  
  # Pattern 4: Self-loop with SAME
  - edgeType:
      undirected:
        between: Person
        via: SIMILAR_TO
        and: SAME
      implies:
        propertyTypes:
        - name: similarity
          valueType: FLOAT
  
  # Pattern 5: Self-loop with SELF
  - edgeType:
      undirected:
        between: Person
        via: RELATED_TO
        and: SELF
      implies:
        propertyTypes:
        - name: relationship
          valueType: STRING
  
  # Pattern 6: Using index reference (no properties)
  - edgeType:
      undirected:
        between: 0
        via: ASSOCIATED_WITH
        and: Person
  
  # Pattern 7: Using typeIdentifier (string array)
  - edgeType:
      undirected:
        between: ["Person", "Employee"]
        via: WORKS_WITH
        and: Person
      implies:
        propertyTypes:
        - name: project
          valueType: STRING
  
  # ========================================
  # EDGE TYPE INHERITANCE - extends with adding
  # ========================================
  
  # Base edge type
  - edgeType:
      undirected:
        between: Person
        via: KNOWS
        and: Person
      implies:
        propertyTypes:
        - name: since
          valueType: DATE
  
  # Subtype using extends with adding (singleton string)
  - edgeType:
      undirected:
        between: Person
        arc: CLOSE_FRIEND
        and: Person
      extends: KNOWS
      adding:
        propertyTypes:
        - name: closeness
          valueType: FLOAT
        - name: sharedInterests
          valueType: LIST
  
  # Another subtype using extends (array form)
  - edgeType:
      undirected:
        between: Person
        via: BEST_FRIEND
        and: Person
      extends: [CLOSE_FRIEND]
      adding:
        propertyTypes:
        - name: yearsKnown
          valueType: INTEGER
  
  # Edge type inheritance with directed edges
  - edgeType:
      directed:
        from: Person
        via: RELATIONSHIP
        to: Person
      implies:
        propertyTypes:
        - name: startDate
          valueType: DATE
  
  # Subtype: MARRIED_TO extends RELATIONSHIP
  - edgeType:
      directed:
        from: Person
        arc: MARRIED_TO
        to: Person
      extends: RELATIONSHIP
      adding:
        propertyTypes:
        - name: weddingDate
          valueType: DATE
        - name: location
          valueType: STRING
  
  # Another relationship subtype
  - edgeType:
      directed:
        from: Person
        via: ENGAGED_TO
        to: Person
      extends: RELATIONSHIP
      adding:
        propertyTypes:
        - name: engagementDate
          valueType: DATE
        - name: weddingPlanned
          valueType: BOOLEAN
  
  # ========================================
  # ANONYMOUS EDGE TYPES (no via: label)
  # ========================================
  
  # Anonymous directed edge - via can be omitted
  - edgeType:
      directed:
        from: Person
        to: Company
      implies:
        propertyTypes:
        - name: weight
          valueType: FLOAT
  
  # Anonymous undirected edge - via can be omitted (no properties)
  - edgeType:
      undirected:
        between: Person
        and: Person
  
  # ========================================
  # ABSTRACT EDGE TYPES
  # ========================================
  
  # Abstract edge type - only subtypes can be instantiated
  # Using abstract: keyword
  - abstract:
      edgeType:
        directed:
          from: Person
          via: RELATIONSHIP
          to: Person
        implies:
          propertyTypes:
          - name: since
            valueType: DATE
  
  # Concrete subtype of abstract RELATIONSHIP
  - edgeType:
      directed:
        from: Person
        via: FRIENDSHIP
        to: Person
      implies:
        supertypes: [RELATIONSHIP]
        propertyTypes:
        - name: closeness
          valueType: FLOAT
  
  # Another concrete subtype - singleton supertype as string
  - edgeType:
      directed:
        from: Person
        via: PROFESSIONAL_RELATIONSHIP
        to: Person
      implies:
        supertypes: RELATIONSHIP
        propertyTypes:
        - name: context
          valueType: STRING
  
  # Abstract edge type using abstract: synonym
  - abstract:
      edgeType:
        undirected:
          between: Company
          via: PARTNERSHIP
          and: Company
        implies:
          propertyTypes:
          - name: startDate
            valueType: DATE
  
  # Concrete subtype of PARTNERSHIP - singleton as string
  - edgeType:
      undirected:
        between: Company
        via: STRATEGIC_PARTNERSHIP
        and: Company
      implies:
        supertypes: PARTNERSHIP
        propertyTypes:
        - name: value
          valueType: FLOAT
  
  # ========================================
  # ABSTRACT ENDPOINT TYPES
  # ========================================
  
  # Edge requiring proper subtype of Person at target
  # Person can exist as isolated node, but edge requires subtype
  - edgeType:
      directed:
        from: Employee
        via: MANAGES
        to:
          abstract: Person
      implies:
        propertyTypes:
        - name: startDate
          valueType: DATE
  
  # Same using abstract: synonym
  - edgeType:
      directed:
        from: Manager
        via: SUPERVISES
        to:
          abstract: Person
      implies:
        propertyTypes:
        - name: role
          valueType: STRING
  
  # Both endpoints can be abstract
  - edgeType:
      directed:
        from:
          abstract: Person
        via: REPORTS_TO
        to:
          abstract: Person
      implies:
        propertyTypes: []
  
  # Undirected with abstract endpoint
  - edgeType:
      undirected:
        between:
          abstract: Person
        via: COLLABORATES_ON
        and: Company
      implies:
        propertyTypes:
        - name: projectName
          valueType: STRING
