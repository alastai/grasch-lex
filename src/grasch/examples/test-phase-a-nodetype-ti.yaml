# Phase A Test: NodeType with TI wrappers
# Tests 0-level (bare), 1-level (shorthand), and 2-level (explicit) TI wrappers

graphSchema:
  graphType:
    nodeTypes:
      # 0-level: Bare nodeType (implicit exactlyOf: concrete:)
      - nodeType:
          typeLabel: Person
          implies:
            labels: [Person]
            properties:
              name: STRING
              age: INTEGER
      
      # 1-level: Shorthand - abstract
      - abstract:
          nodeType:
            typeLabel: Vehicle
            implies:
              labels: [Vehicle]
              properties:
                make: STRING
                model: STRING
      
      # 1-level: Shorthand - concrete
      - concrete:
          nodeType:
            typeLabel: Product
            implies:
              labels: [Product]
              properties:
                sku: STRING
                price: FLOAT
      
      # 1-level: Shorthand - final
      - final:
          nodeType:
            typeLabel: Company
            implies:
              labels: [Company]
              properties:
                name: STRING
      
      # 1-level: Shorthand - sealed
      - sealed:
          nodeType:
            typeLabel: Tag
            implies:
              labels: [Tag]
              properties:
                name: STRING
      
      # 2-level: Explicit - exactlyOf: concrete:
      - exactlyOf:
          concrete:
            nodeType:
              typeLabel: Employee
              implies:
                labels: [Employee]
                properties:
                  employeeId: STRING
      
      # 2-level: Explicit - exactlyOf: abstract:
      - exactlyOf:
          abstract:
            nodeType:
              typeLabel: Entity
              implies:
                labels: [Entity]
                properties:
                  id: STRING
      
      # 2-level: Explicit - subtypesOf: concrete:
      - subtypesOf:
          concrete:
            nodeType:
              typeLabel: Manager
              implies:
                labels: [Manager]
                properties:
                  department: STRING
      
      # 2-level: Explicit - subtypesOf: abstract:
      - subtypesOf:
          abstract:
            nodeType:
              typeLabel: Asset
              implies:
                labels: [Asset]
                properties:
                  value: FLOAT
      
      # 2-level: Explicit - properSubtypesOf: concrete:
      - properSubtypesOf:
          concrete:
            nodeType:
              typeLabel: Director
              implies:
                labels: [Director]
                properties:
                  division: STRING
