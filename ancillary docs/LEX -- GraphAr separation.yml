# LEX Schema and GraphAr Storage Schema Separation Example
# This demonstrates how LEX schema (logical) can be separated from GraphAr storage schema (physical)
# Two YAML documents in one file, separated by ---

# Document 1: LEX Schema (Logical Graph Schema)
identifier:
  locallyQualifiedObjectName: "/examples/snb-demo-graph"

valueTypeSystemName: "CANONICAL"

graphType:
  $ref: "graph_type_defaults.yaml"
  
  nodeTypes:
    - nodeType:
        typeLabel: "Person"
        implies:
          propertyTypes:
            - name: "id"
              valueType: "INTEGER"
              notNull: true
            - name: "firstName"
              valueType: "STRING"
              notNull: true
            - name: "lastName"
              valueType: "STRING"
              notNull: true
  
  edgeTypes:
    - edgeType:
        typeLabel: "KNOWS"


              notNull: true
        direction: "DIRECTED"
        firstEndpointNodeType:
          typeLabel: "Person"
        secondEndpointNodeType:
          typeLabel: "Person"

  # Reference to storage schema
  storageSchema:
    kind: "GraphAr"
    reference: "snb-demo-graph-storage.yml"

---
# Document 2: GraphAr Storage Schema (Physical Storage Layout)
storageSchema:
  format: "GraphAr"
  version: "0.11.0"
  
  # Reference back to logical schema
  logicalSchema:
    kind: "LEX"
    reference: "snb-demo-graph-schema.yml"
  
  # GraphAr-specific configuration
  graphInfo:
    name: "snb-demo-graph"
    prefix: "/data/snb-demo/"
    
    # Vertex (Node) storage configuration
    vertices:
      - typeLabel: "Person"
        chunk_size: 1024
        prefix: "person/"
        property_groups:
          - property_group:
              properties: ["id", "firstName", "lastName"]
    
    # Edge storage configuration
    edges:
      - src_typeLabel: "Person"
        edge_typeLabel: "KNOWS"
        dst_typeLabel: "Person"
        chunk_size: 2048
        prefix: "knows/"
        directed: true
        property_groups:
          - property_group:
              properties: ["creationDate"]
  
  # File system layout
  fileLayout:
    baseDirectory: "/data/snb-demo/"
    vertexDirectory: "vertices/"
    edgeDirectory: "edges/"
    
  # Compression and optimization settings
  optimization:
    compression: "snappy"
    columnOriented: true
    indexing:
      - type: "btree"
        columns: ["id"]
