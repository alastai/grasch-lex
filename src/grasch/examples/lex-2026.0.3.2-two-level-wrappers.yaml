# Two-Level Wrapper Examples
# Demonstrates all four valid canonical wrapper combinations

graphSchema:
  pathName: /examples/two-level-wrappers
  
  graphType:
    propertyGraphDataModel:
      valueTypeSystemName: CANONICAL
    
    nodeTypes:
      # Combination 1: exactlyOf: concrete: (most common, default)
      - exactlyOf:
          concrete:
            nodeType:
              typeLabel: ConcreteExact
      
      # Combination 2: exactlyOf: abstract: (edge case - abstract but no subtypes allowed)
      - exactlyOf:
          abstract:
            nodeType:
              typeLabel: AbstractExact
      
      # Combination 3: subtypesOf: concrete: (concrete base with subtype matching)
      - subtypesOf:
          concrete:
            nodeType:
              typeLabel: ConcreteWithSubtypes
      
      # Combination 4: subtypesOf: abstract: (most common for abstract base types)
      - subtypesOf:
          abstract:
            nodeType:
              typeLabel: AbstractWithSubtypes
    
    edgeTypes:
      - edgeType:
          directed:
            from:
              subtypesOf:
                abstract: Entity
            to:
              exactlyOf:
                concrete: ConcreteExact
            via:
              typeLabel: RELATIONSHIP
