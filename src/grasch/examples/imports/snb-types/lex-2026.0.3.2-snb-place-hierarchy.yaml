# SNB Place Type Hierarchy
# Place is an abstract supertype for City, Country, and Continent
# This is an importable array - the interpretation wrapper is applied by the importing file

- abstract:
    nodeType:
      typeLabel: Place
      implies:
        propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: url
            valueType: STRING
          - name: type
            valueType: STRING

- nodeType:
    typeLabel: City
    extends: Place

- nodeType:
    typeLabel: Country
    extends: Place

- nodeType:
    typeLabel: Continent
    extends: Place
