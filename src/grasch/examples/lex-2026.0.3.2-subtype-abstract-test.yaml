graphSchema:
  pathName: /test/subtype-abstract
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
    - nodeType:
        typeLabel: Employee
        implies:
          supertypes: Person
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: employeeId
            valueType: STRING
    - nodeType:
        typeLabel: Contractor
        implies:
          supertypes:
          - Person
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: contractId
            valueType: STRING
    - nodeType:
        typeLabel: Manager
        implies:
          supertypes:
          - Employee
          - Person
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: employeeId
            valueType: STRING
          - name: department
            valueType: STRING
    - nodeType:
        typeLabel: Director
        extends: Manager
        adding:
          propertyTypes:
          - name: division
            valueType: STRING
    - nodeType:
        typeLabel: VicePresident
        extends:
        - Director
        adding:
          propertyTypes:
          - name: region
            valueType: STRING
    - nodeType:
        typeLabel: CEO
        extends:
        - VicePresident
        - Director
        adding:
          labels:
          - Executive
          - BoardMember
          propertyTypes:
          - name: boardSeat
            valueType: INTEGER
    edgeTypes:
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: KNOWS
        implies:
          propertyTypes:
          - name: since
            valueType: DATE
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: FRIENDSHIP
        implies:
          supertypes: KNOWS
          propertyTypes:
          - name: since
            valueType: DATE
          - name: closeness
            valueType: FLOAT
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: PROFESSIONAL_RELATIONSHIP
        implies:
          supertypes:
          - KNOWS
          propertyTypes:
          - name: since
            valueType: DATE
          - name: context
            valueType: STRING
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: CLOSE_FRIEND
        extends: FRIENDSHIP
        adding:
          propertyTypes:
          - name: yearsKnown
            valueType: INTEGER
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: BEST_FRIEND
        extends:
        - CLOSE_FRIEND
        adding:
          propertyTypes:
          - name: trustLevel
            valueType: FLOAT
    subtypesOf:
      abstract:
        nodeTypes:
        - nodeType:
            typeLabel: Message
            implies:
              propertyTypes:
              - name: id
                valueType: INTEGER
              - name: content
                valueType: STRING
        edgeTypes:
        - edgeType:
            directed:
              from:
                typeLabel: Person
              to:
                typeLabel: Person
              via: RELATIONSHIP
            implies:
              propertyTypes:
              - name: startDate
                valueType: DATE
