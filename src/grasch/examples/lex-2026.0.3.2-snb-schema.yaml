graphSchema:
  pathName: /benchmarks/ldbc/snb
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
            notNull: true
          - name: firstName
            valueType: STRING
            notNull: true
          - name: lastName
            valueType: STRING
            notNull: true
          - name: gender
            valueType: STRING
            notNull: true
          - name: birthday
            valueType: DATE
            notNull: true
          - name: creationDate
            valueType: ZONED DATETIME
            notNull: true
          - name: locationIP
            valueType: STRING
            notNull: true
          - name: browserUsed
            valueType: STRING
            notNull: true
          - name: language
            valueType: LIST
          - name: email
            valueType: LIST
    - import: imports/snb-types/lex-2026.0.3.2-snb-organisation-hierarchy.yaml
    - import: imports/snb-types/lex-2026.0.3.2-snb-place-hierarchy.yaml
    - nodeType:
        typeLabel: Tag
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
            notNull: true
          - name: name
            valueType: STRING
            notNull: true
          - name: url
            valueType: STRING
            notNull: true
    - nodeType:
        typeLabel: TagClass
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
            notNull: true
          - name: name
            valueType: STRING
            notNull: true
          - name: url
            valueType: STRING
            notNull: true
    - nodeType:
        typeLabel: Forum
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
            notNull: true
          - name: title
            valueType: STRING
            notNull: true
          - name: creationDate
            valueType: ZONED DATETIME
            notNull: true
    - import: imports/snb-types/lex-2026.0.3.2-snb-message-hierarchy.yaml
    edgeTypes:
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: KNOWS
        implies:
          propertyTypes:
          - name: creationDate
            valueType: ZONED DATETIME
            notNull: true
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeIdentifier:
            - Post
            - Comment
          via: LIKES
        implies:
          propertyTypes:
          - name: creationDate
            valueType: ZONED DATETIME
            notNull: true
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabel: Tag
          via: HAS_INTEREST
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeIdentifier:
            - Person
            - Organisation
            - Post
            - Comment
          to:
            typeLabel: Place
          via: IS_LOCATED_IN
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabel: Organisation
          via: STUDY_AT
        implies:
          propertyTypes:
          - name: classYear
            valueType: INTEGER
            notNull: true
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabel: Organisation
          via: WORK_AT
        implies:
          propertyTypes:
          - name: workFrom
            valueType: INTEGER
            notNull: true
    - edgeType:
        directed:
          from:
            typeLabel: Forum
          to:
            typeLabel: Person
          via: HAS_MEMBER
        implies:
          propertyTypes:
          - name: joinDate
            valueType: ZONED DATETIME
            notNull: true
    - edgeType:
        directed:
          from:
            typeLabel: Forum
          to:
            typeLabel: Person
          via: HAS_MODERATOR
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Forum
          to:
            typeLabel: Post
          via: CONTAINER_OF
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeIdentifier:
            - Post
            - Comment
          to:
            typeLabel: Person
          via: HAS_CREATOR
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Comment
          to:
            typeIdentifier:
            - Post
            - Comment
          via: REPLY_OF
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeIdentifier:
            - Post
            - Comment
            - Forum
          to:
            typeLabel: Tag
          via: HAS_TAG
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Tag
          to:
            typeLabel: TagClass
          via: HAS_TYPE
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: TagClass
          to:
            typeLabel: TagClass
          via: IS_SUBCLASS_OF
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Place
          to:
            typeLabel: Place
          via: IS_PART_OF
        implies:
          propertyTypes: []
  constraints:
    personIdUnique:
      name: personIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Person
        uniqueKeyComponentPropertyNames:
        - id
    postIdUnique:
      name: postIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Post
        uniqueKeyComponentPropertyNames:
        - id
