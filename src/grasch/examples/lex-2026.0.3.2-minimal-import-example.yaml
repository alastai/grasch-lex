graphSchema:
  pathName: /examples/minimal-import
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - import: imports/snb-types/lex-2026.0.3.2-snb-message-hierarchy.yaml
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
            notNull: true
          - name: name
            valueType: STRING
            notNull: true
    edgeTypes:
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabel: Post
          via: AUTHORED
        implies:
          propertyTypes:
          - name: creationDate
            valueType: DATE
            notNull: true
