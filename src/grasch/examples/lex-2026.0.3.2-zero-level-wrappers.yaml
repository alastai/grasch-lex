# Zero-Level Wrapper Examples
# Demonstrates bare type references (no wrappers)
# Default interpretation: exactlyOf: concrete:

graphSchema:
  pathName: /examples/zero-level-wrappers
  
  graphType:
    propertyGraphDataModel:
      valueTypeSystemName: CANONICAL
    
    nodeTypes:
      - nodeType:
          typeLabel: Person  # Bare reference - defaults to exactlyOf: concrete:
      - nodeType:
          typeLabel: Company
    
    edgeTypes:
      - edgeType:
          directed:
            from: Person      # Bare reference
            to: Company       # Bare reference
            via:
              typeLabel: WORKS_FOR    # Edge label as object with typeLabel child
