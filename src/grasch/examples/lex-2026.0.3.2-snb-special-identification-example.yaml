graphSchema:
  pathName: /benchmarks/ldbc/snb-special
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: firstName
            valueType: STRING
          - name: lastName
            valueType: STRING
    - nodeType:
        index: 0
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
    - nodeType:
        index: 1
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: title
            valueType: STRING
    - nodeType:
        typeLabel: Message
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: content
            valueType: STRING
          - name: creationDate
            valueType: ZONED DATETIME
    - nodeType:
        typeLabels:
        - Post
        - Message
        implies:
          supertypes:
          - Message
          propertyTypes:
          - name: imageFile
            valueType: STRING
          - name: language
            valueType: STRING
    - nodeType:
        typeLabels:
        - Comment
        - Message
        implies:
          supertypes:
          - Message
          propertyTypes:
          - name: replyCount
            valueType: INTEGER
    edgeTypes:
    - edgeType:
        undirected:
          between:
            typeLabel: Person
          and:
            typeLabel: Person
          via: KNOWS
        implies:
          propertyTypes:
          - name: creationDate
            valueType: ZONED DATETIME
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            index: 0
          via: WORKS_AT
        implies:
          propertyTypes:
          - name: startDate
            valueType: DATE
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            index: 1
          via: MODERATES
        implies:
          propertyTypes: []
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabels:
            - Post
            - Message
          via: LIKES
        implies:
          propertyTypes:
          - name: creationDate
            valueType: ZONED DATETIME
    - edgeType:
        directed:
          from:
            typeLabel: Person
          to:
            typeLabels:
            - Comment
            - Message
        implies:
          propertyTypes:
          - name: weight
            valueType: FLOAT
    - edgeType:
        undirected:
          between:
            index: 0
          and:
            index: 1
        implies:
          propertyTypes: []
  constraints:
    personIdUnique:
      name: personIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Person
        uniqueKeyComponentPropertyNames:
        - id
