# Minimal Import Example - Demonstrates all three import patterns

identifier:
  locallyQualifiedObjectName: "/examples/minimal-import-demo"

valueTypeSystemName: "CANONICAL"

graphType:
  # Pattern 1: Import defaults block
  defaults:
    import: "lex-2026.0.3.2-graph-type-defaults.yaml"
  
  # Pattern 2: Import subset of node types (Message hierarchy)
  nodeTypes:
    - import: "snb_types/message_hierarchy.yaml"
    - nodeType:
        typeLabel: "Person"
        implies:
          propertyTypes:
            - name: "id"
              valueType: "INTEGER"
              notNull: true
            - name: "name"
              valueType: "STRING"
              notNull: true
  
  edgeTypes:
    - edgeType:
        typeLabel: "AUTHORED"
        implies:
          propertyTypes:
            - name: "creationDate"
              valueType: "DATE"
              notNull: true
        direction: "DIRECTED"
        firstEndpointNodeType:
          typeLabel: "Person"
        secondEndpointNodeType:
          typeLabel: "Post"
