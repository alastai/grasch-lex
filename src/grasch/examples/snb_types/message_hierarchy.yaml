# SNB Message Type Hierarchy
# Message is the supertype for Post and Comment

# Base Message type
- nodeType:
    typeLabel: Message
    implies:
      propertyTypes:
        - name: id
          valueType: INTEGER
          notNull: true
        - name: creationDate
          valueType: ZONED DATETIME
          notNull: true
        - name: locationIP
          valueType: STRING
          notNull: true
        - name: browserUsed
          valueType: STRING
          notNull: true
        - name: content
          valueType: STRING
        - name: length
          valueType: INTEGER
          notNull: true

# Post subtype - adds image and language properties
- nodeType:
    typeLabel: Post
    implies:
      supertypes:
        - Message
      propertyTypes:
        - name: imageFile
          valueType: STRING
        - name: language
          valueType: STRING

# Comment subtype - no additional properties beyond Message
- nodeType:
    typeLabel: Comment
    implies:
      supertypes:
        - Message
      propertyTypes: []
