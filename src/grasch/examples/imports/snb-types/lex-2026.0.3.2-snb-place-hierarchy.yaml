# SNB Place Type Hierarchy
# Place is an abstract supertype for City, Country, and Continent
# All instances have the Place label plus their specific subtype label
# This is an importable fragment, not a top-level document

sealed:
  nodeTypes:
  # Abstract Place supertype - never instantiated directly
  - abstract:
      nodeType:
        typeLabel: Place
        implies:
          propertyTypes:
            - name: id
              valueType: INTEGER
              notNull: true
            - name: name
              valueType: STRING
              notNull: true
            - name: url
              valueType: STRING
              notNull: true
            - name: type
              valueType: STRING
              notNull: true

  # City subtype - instances have labels [Place, City]
  - final:
      nodeType:
        typeLabel: City
        implies:
          supertypes:
            - Place
          propertyTypes: []

  # Country subtype - instances have labels [Place, Country]
  - final:
      nodeType:
        typeLabel: Country
        implies:
          supertypes:
            - Place
          propertyTypes: []

  # Continent subtype - instances have labels [Place, Continent]
  - final:
      nodeType:
        typeLabel: Continent
        implies:
          supertypes:
            - Place
          propertyTypes: []
