# Complete Import Patterns Example
# Demonstrates all supported import patterns

graphSchema:
  pathName: "/examples/all-import-patterns"
  
  graphType:
    # Pattern 1: Import defaults block (includes valueTypeSystemName)
    propertyGraphDataModel:
      import: "imports/lex-2026.0.3.2-property-graph-data-model.yaml"
    
    # Pattern 2: Import entire nodeTypes array
    nodeTypes:
      import: "imports/lex-2026.0.3.2-node-type-syntax-examples.yaml"
    
    # Pattern 3: Import entire edgeTypes array
    edgeTypes:
      import: "imports/lex-2026.0.3.2-edge-type-syntax-examples.yaml"
