graphSchema:
  pathName: https://ldbcouncil.org/schemas/|/benchmarks/ldbc/finbench
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model.yaml
    nodeTypes:
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: isBlocked
            valueType: BOOLEAN
          - name: createTime
            valueType: ZONED DATETIME
    - nodeType:
        typeLabel: Account
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: createTime
            valueType: ZONED DATETIME
          - name: isBlocked
            valueType: BOOLEAN
          - name: type
            valueType: STRING
    - nodeType:
        typeLabel: Company
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: name
            valueType: STRING
          - name: isBlocked
            valueType: BOOLEAN
          - name: createTime
            valueType: ZONED DATETIME
          - name: country
            valueType: STRING
          - name: city
            valueType: STRING
          - name: business
            valueType: STRING
          - name: description
            valueType: STRING
          - name: url
            valueType: STRING
          - name: metadata
            valueType: JSON
    - nodeType:
        typeLabel: Medium
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: type
            valueType: STRING
          - name: isBlocked
            valueType: BOOLEAN
          - name: createTime
            valueType: ZONED DATETIME
          - name: lastLoginTime
            valueType: ZONED DATETIME
          - name: riskLevel
            valueType: FLOAT
    - nodeType:
        typeLabel: Loan
        implies:
          propertyTypes:
          - name: id
            valueType: INTEGER
          - name: loanAmount
            valueType: FLOAT
          - name: balance
            valueType: FLOAT
          - name: createTime
            valueType: ZONED DATETIME
          - name: loanUsage
            valueType: STRING
          - name: interestRate
            valueType: FLOAT
    edgeTypes:
    - edgeType:
        directed:
          from: Person
          to: Account
          via: OWN
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
    - edgeType:
        directed:
          from: Account
          to: Account
          via: TRANSFER
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: amount
            valueType: FLOAT
          - name: orderNum
            valueType: INTEGER
          - name: comment
            valueType: STRING
          - name: payType
            valueType: STRING
          - name: goodsType
            valueType: STRING
    - edgeType:
        directed:
          from: Account
          to: Account
          via: WITHDRAW
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: amount
            valueType: FLOAT
    - edgeType:
        directed:
          from: Account
          to: Loan
          via: REPAY
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: amount
            valueType: FLOAT
    - edgeType:
        directed:
          from: Loan
          to: Account
          via: DEPOSIT
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: amount
            valueType: FLOAT
    - edgeType:
        directed:
          from: Person
          to: Loan
          via: APPLY
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: org
            valueType: STRING
    - edgeType:
        directed:
          from: Person
          to: Person
          via: GUARANTEE
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: relation
            valueType: STRING
    - edgeType:
        directed:
          from: Person
          to: Company
          via: INVEST
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
          - name: ratio
            valueType: FLOAT
    - edgeType:
        directed:
          from:
          - Person
          - Company
          to: Medium
          via: USE
        implies:
          propertyTypes:
          - name: createTime
            valueType: ZONED DATETIME
  constraints:
    personIdUnique:
      name: personIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Person
        uniqueKeyComponentPropertyNames:
        - id
    accountIdUnique:
      name: accountIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Account
        uniqueKeyComponentPropertyNames:
        - id
    companyIdUnique:
      name: companyIdUnique
      rule:
        subject: UNIQUE
        constraintPattern: Company
        uniqueKeyComponentPropertyNames:
        - id
