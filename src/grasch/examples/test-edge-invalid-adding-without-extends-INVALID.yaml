graphSchema:
  pathName: /test/edge-invalid-adding-without-extends
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model-defaults.yaml
    
    nodeTypes:
      - nodeType:
          typeLabel: Person
    
    edgeTypes:
      - edgeType:
