# LEX-100r3 Graph Type Default Values
# These are the default values specified in the LEX-100r3 specification
# and can be imported into graph schemas using import:

graphPreferredName: "GRAPH"
nodePreferredName: "NODE"
edgePreferredName: "EDGE"

nodeTypeMinimumLabels: 1
nodeTypeMaximumLabels: 20
nodeTypeMinimumPropertyTypes: 0
nodeTypeMaximumPropertyTypes: 1000

edgeTypeMinimumLabels: 1
edgeTypeMaximumLabels: 20
edgeTypeMinimumPropertyTypes: 0
edgeTypeMaximumPropertyTypes: 1000
