# LEX Schema and GraphAr Storage Schema Separation Example
# This demonstrates how LEX schema (logical) can be separated from GraphAr storage schema (physical)
# Two YAML documents in one file, separated by ---

# Document 1: LEX Schema (Logical Graph Schema)
identifier:
  locallyQualifiedObjectName: "/examples/snb-demo-graph"

valueTypeSystemName: "CANONICAL"

graphType:
  $ref: "graph_type_defaults.yaml"
  
  nodeTypes:
    - nodeType:
        typeLabel: "Person"
        implies:
          propertyTypes:
            - name: "id"
              valueType: "INTEGER"
              notNull: true
            - name: "firstName"
              valueType: "STRING"
              notNull: true
            - name: "lastName"
              valueType: "STRING"
              notNull: true
            - name: "email"
              valueType: "STRING"
            - name: "birthDate"
              valueType: "DATE"
    
    - nodeType:
        typeLabel: "Company"
        implies:
          propertyTypes:
            - name: "id"
              valueType: "INTEGER"
              notNull: true
            - name: "name"
              valueType: "STRING"
              notNull: true
            - name: "industry"
              valueType: "STRING"
  
  edgeTypes:
    - edgeType:
        typeLabel: "KNOWS"
        implies:
          propertyTypes:
            - name: "creationDate"
              valueType: "DATE"
              notNull: true
        direction: "DIRECTED"
        firstEndpointNodeType:
          typeLabel: "Person"
        secondEndpointNodeType:
          typeLabel: "Person"

  # Reference to storage schema
  storageSchema:
    kind: "GraphAr"
    reference: "snb-demo-graph-storage.yml"

---
# Document 2: GraphAr Storage Schema (Physical Storage Layout)
# Demonstrates different storage formats for different property groups
storageSchema:
  format: "GraphAr"
  version: "0.11.0"
  
  # Reference back to logical schema
  logicalSchema:
    kind: "LEX"
    reference: "snb-demo-graph-schema.yml"
  
  # GraphAr-specific configuration
  graphInfo:
    name: "snb-demo-graph"
    prefix: "/data/snb-demo/"
    
    # Vertex (Node) storage configuration
    vertices:
      - typeLabel: "Person"
        chunk_size: 1024
        prefix: "person/"
        # Property groups with different storage formats
        property_groups:
          - property_group:
              properties: ["id", "firstName"]
              file_type: "parquet"
          - property_group:
              properties: ["lastName", "birthDate"]
              file_type: "csv"
          - property_group:
              properties: ["email"]
              file_type: "json"
      
      - typeLabel: "Company"
        chunk_size: 512
        prefix: "company/"
        file_type: "orc"
    
    # Edge storage configuration
    edges:
      - src_typeLabel: "Person"
        edge_typeLabel: "KNOWS"
        dst_typeLabel: "Person"
        chunk_size: 2048
        prefix: "knows/"
        directed: true
        property_groups:
          - property_group:
              properties: ["creationDate"]
              file_type: "parquet"
  
  # File system layout
  fileLayout:
    baseDirectory: "/data/snb-demo/"
    vertexDirectory: "vertices/"
    edgeDirectory: "edges/"
    
  # Compression and optimization settings
  optimization:
    compression: "snappy"
    columnOriented: true
    indexing:
      - type: "btree"
        columns: ["id"]
