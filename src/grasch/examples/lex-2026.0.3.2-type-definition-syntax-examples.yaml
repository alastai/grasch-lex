# LEX:2026.0.3.2 Type Definition Syntax Examples
# Demonstrates all valid syntax patterns for defining types with inheritance

pathName: "/examples/type-definition-syntax"

graphType:
  nodeTypes:
    # ========================================
    # Pattern A: Base type with implies
    # ========================================
    # Use when: Defining a type with no supertypes
    # typeLabel is implicit, never appears in labels
    # labels can be omitted if only typeLabel applies
    
    - nodeType:
        typeLabel: Person
        implies:
          propertyTypes:
            - name: id
              valueType: INTEGER
              notNull: true
            - name: name
              valueType: STRING
              notNull: true
            - name: age
              valueType: INTEGER

    # ========================================
    # Pattern B: Base type with additional labels
    # ========================================
    # Use when: Type has labels beyond its typeLabel
    # typeLabel (Entity) is implicit, only list additional labels
    
    - nodeType:
        typeLabel: Entity
        implies:
          labels:
            - Auditable
            - Versioned
          propertyTypes:
            - name: id
              valueType: INTEGER
              notNull: true
            - name: createdAt
              valueType: ZONED DATETIME
              notNull: true

    # ========================================
    # Pattern C: Subtype using extends with adding
    # ========================================
    # Use when: Extending a type and only specifying NEW properties/labels
    # adding: means "these are ONLY the new additions"
    # Inherited properties are NOT listed
    
    - nodeType:
        typeLabel: Employee
        extends: [Person]
        adding:
          propertyTypes:
            - name: employeeId
              valueType: STRING
              notNull: true
            - name: department
              valueType: STRING
            - name: salary
              valueType: FLOAT

    # ========================================
    # Pattern D: Subtype using extends with adding labels
    # ========================================
    # Use when: Adding both new labels and new properties
    # typeLabel (Manager) is implicit
    # Only list additional labels beyond Manager
    
    - nodeType:
        typeLabel: Manager
        extends: [Employee]
        adding:
          labels:
            - Leader
            - Supervisor
          propertyTypes:
            - name: teamSize
              valueType: INTEGER
            - name: budget
              valueType: FLOAT

    # ========================================
    # Pattern E: Subtype using implies with supertypes (full specification)
    # ========================================
    # Use when: Explicitly listing ALL properties including inherited
    # supertypes: inside implies: means "extends these types"
    # Must list ALL properties (inherited + new)
    # Useful for documentation or when properties need modification
    
    - nodeType:
        typeLabel: Contractor
        implies:
          supertypes: [Person]
          propertyTypes:
            # Inherited from Person
            - name: id
              valueType: INTEGER
              notNull: true
            - name: name
              valueType: STRING
              notNull: true
            - name: age
              valueType: INTEGER
            # New properties for Contractor
            - name: contractId
              valueType: STRING
              notNull: true
            - name: hourlyRate
              valueType: FLOAT
            - name: contractEnd
              valueType: DATE

    # ========================================
    # Pattern F: Subtype with supertypes and additional labels (full spec)
    # ========================================
    # Use when: Explicitly listing everything including labels
    # typeLabel (Consultant) is implicit, never in labels
    # Must list ALL labels (inherited + new) and ALL properties
    
    - nodeType:
        typeLabel: Consultant
        implies:
          supertypes: [Contractor]
          labels:
            # Additional labels beyond Consultant
            - Expert
            - Advisor
          propertyTypes:
            # ALL properties including inherited
            - name: id
              valueType: INTEGER
              notNull: true
            - name: name
              valueType: STRING
              notNull: true
            - name: age
              valueType: INTEGER
            - name: contractId
              valueType: STRING
              notNull: true
            - name: hourlyRate
              valueType: FLOAT
            - name: contractEnd
              valueType: DATE
            # New properties for Consultant
            - name: specialization
              valueType: STRING
            - name: certifications
              valueType: LIST

    # ========================================
    # Pattern G: Abstract supertype in hierarchy
    # ========================================
    # Use when: Defining abstract types that cannot be instantiated
    # Wrapped in allowSubtypesOf with abstractSupertypes
    
  allowSubtypesOf:
    abstractSupertypes:
      nodeTypes:
        # Abstract Message type
        - nodeType:
            typeLabel: Message
            implies:
              propertyTypes:
                - name: id
                  valueType: INTEGER
                  notNull: true
                - name: content
                  valueType: STRING
                - name: createdAt
                  valueType: ZONED DATETIME
                  notNull: true

        # Concrete subtype using extends with adding
        - nodeType:
            typeLabel: Post
            extends: [Message]
            adding:
              propertyTypes:
                - name: title
                  valueType: STRING
                - name: imageUrl
                  valueType: STRING

        # Concrete subtype using extends with adding labels
        - nodeType:
            typeLabel: Comment
            extends: [Message]
            adding:
              labels:
                - Reply
              propertyTypes:
                - name: parentId
                  valueType: INTEGER
                  notNull: true

  edgeTypes:
    # Edge types follow the same patterns as node types
    - edgeType:
        typeLabel: KNOWS
        implies:
          propertyTypes:
            - name: since
              valueType: DATE
        direction: UNDIRECTED
        firstEndpointNodeType:
          typeLabel: Person
        secondEndpointNodeType:
          typeLabel: Person

# ========================================
# Summary of Syntax Rules
# ========================================
#
# 1. typeLabel is NEVER repeated in labels (it's implicit)
# 2. Omit labels if only typeLabel applies
# 3. extends: and supertypes: are synonyms
#    - Use extends: with adding: (incremental)
#    - Use supertypes: with implies: (full specification)
# 4. adding: can ONLY appear under extends:
# 5. implies: and extends: are mutually exclusive at same level
# 6. implies: can contain supertypes: to show inheritance
# 7. With adding: list ONLY new properties/labels
# 8. With implies + supertypes: list ALL properties/labels
