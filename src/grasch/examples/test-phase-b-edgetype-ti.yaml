# Phase B Test: EdgeType with TI wrappers (no endpoint TIs yet)
# Tests 0-level (bare), 1-level (shorthand), and 2-level (explicit) TI wrappers

graphSchema:
  pathName: /test/phase-b
  graphType:
    propertyGraphDataModel:
      valueTypeSystemName: CANONICAL
    
    nodeTypes:
      - nodeType:
          typeLabel: Person
          implies:
            labels: [Person]
            propertyTypes:
              - name: name
                valueType: STRING
      - nodeType:
          typeLabel: Company
          implies:
            labels: [Company]
            propertyTypes:
              - name: name
                valueType: STRING
    
    edgeTypes:
      # 0-level: Bare edgeType (implicit exactlyOf: concrete:)
      - edgeType:
          directed:
            from: Person
            to: Person
            via:
              typeLabel: KNOWS
              implies:
                propertyTypes:
                  - name: since
                    valueType: DATE
      
      # 1-level: Shorthand - abstract
      - abstract:
          edgeType:
            directed:
              from: Person
              via: MANAGES
              to: Person
            implies:
              propertyTypes:
                - name: startDate
                  valueType: DATE
      
      # 1-level: Shorthand - concrete
      - concrete:
          edgeType:
            directed:
              from: Person
              via: WORKS_FOR
              to: Company
            implies:
              propertyTypes:
                - name: position
                  valueType: STRING
      
      # 1-level: Shorthand - final
      - final:
          edgeType:
            directed:
              from: Person
              via: OWNS
              to: Company
            implies:
              propertyTypes:
                - name: shares
                  valueType: FLOAT
      
      # 1-level: Shorthand - properSubtypesOf
      - properSubtypesOf:
          edgeType:
            undirected:
              between: Person
              via: RELATED_TO
              and: Person
            implies:
              propertyTypes:
                - name: relationship
                  valueType: STRING
      
      # 2-level: Explicit - exactlyOf: concrete:
      - exactlyOf:
          concrete:
            edgeType:
              directed:
                from: Person
                via: LIVES_IN
                to: Person
              implies:
                propertyTypes:
                  - name: since
                    valueType: DATE
      
      # 2-level: Explicit - exactlyOf: abstract:
      - exactlyOf:
          abstract:
            edgeType:
              directed:
                from: Person
                via: INTERACTS_WITH
                to: Person
              implies:
                propertyTypes:
                  - name: timestamp
                    valueType: ZONED DATETIME
      
      # 2-level: Explicit - subtypesOf: concrete:
      - subtypesOf:
          concrete:
            edgeType:
              directed:
                from: Person
                via: SUPERVISES
                to: Person
              implies:
                propertyTypes:
                  - name: level
                    valueType: INTEGER
      
      # 2-level: Explicit - subtypesOf: abstract:
      - subtypesOf:
          abstract:
            edgeType:
              undirected:
                between: Person
                via: COLLABORATES_WITH
                and: Person
              implies:
                propertyTypes:
                  - name: project
                    valueType: STRING
      
      # 2-level: Explicit - properSubtypesOf: concrete: (NEW!)
      - properSubtypesOf:
          concrete:
            edgeType:
              directed:
                from: Person
                via: REPORTS_TO
                to: Person
              implies:
                propertyTypes:
                  - name: department
                    valueType: STRING
      
      # 2-level: Explicit - properSubtypesOf: abstract: (NEW!)
      - properSubtypesOf:
          abstract:
            edgeType:
              directed:
                from: Person
                via: INFLUENCES
                to: Person
              implies:
                propertyTypes:
                  - name: strength
                    valueType: FLOAT
