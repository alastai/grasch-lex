# Test: Edge type demonstrating correct property ordering
# Expected: PASS - Shows required property order with comments

graphSchema:
  pathName: /test/edge-property-ordering
  graphType:
    propertyGraphDataModel:
      import: imports/lex-2026.0.3.2-property-graph-data-model-defaults.yaml
    
    nodeTypes:
      - nodeType:
          typeLabel: Person
    
    edgeTypes:
      # Directed edge with full property ordering
      # Order: from → to → via (with typeLabel, extends, implies)
      - edgeType:
          directed:
            # Step 1: Source endpoint (simplified to string reference)
            from: Person
            # Step 2: Destination endpoint (simplified to string reference)
            to: Person
            # Step 3: Edge label container with typeLabel, extends, and implies
            via:
              typeLabel: KNOWS
              extends: RELATIONSHIP
              implies:
                propertyTypes:
                  - name: since
                    valueType: DATE
      
      # Undirected edge with full property ordering
      # Order: between → and → via (with typeLabel and implies)
      - edgeType:
          undirected:
            # Step 1: First endpoint (simplified to string reference)
            between: Person
            # Step 2: Second endpoint (simplified to string reference)
            and: Person
            # Step 3: Edge label container with typeLabel and implies
            via:
              typeLabel: FRIENDS_WITH
              implies:
                propertyTypes:
                  - name: since
                    valueType: DATE
